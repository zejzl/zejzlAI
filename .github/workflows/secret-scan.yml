name: Secret scan

# Zejzl's merge rule (since 2026-10-31: merge on green CI, no review gate) assumes a secret scan that actually runs.
# Same job as trading-lab's and tosl's secret-scan.yml. This job scans the commits of every pull request and every push to main with gitleaks.
# It uses only the job's own GITHUB_TOKEN (read-only: contents and pull requests); no license is needed for a personal account; PR comments are off
# because the token has no pull-request write permission. A hit fails the job: rotate the secret, then rewrite the branch.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: read   # the action lists the PR's commits to know what to scan; still no write permission

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the scan walks the commits of the PR or push, not just the checked-out tree
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_SUMMARY: "true"
