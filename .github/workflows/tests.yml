name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip
        cache-dependency-path: requirements.txt

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Check Python syntax
      run: |
        python -m py_compile main.py ai_framework.py messagebus.py web_dashboard.py
        find src tests -name "*.py" -print0 | xargs -0 -n1 python -m py_compile

    # No network and no real API keys: tests/conftest.py blocks outbound
    # connections and sets dummy provider keys.
    - name: Run pytest smoke suite
      run: python -m pytest -q

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'

    - name: Install flake8
      run: |
        python -m pip install --upgrade pip
        pip install flake8

    - name: Lint with flake8
      run: |
        # Fatal: syntax errors and other hard errors. F821 (undefined names)
        # is reported but non-fatal until the fix-undefined-names branch lands;
        # then add F821 back to the fatal list.
        flake8 . --count --select=E9,F63,F7,F822,F823 --show-source --statistics
        flake8 . --count --exit-zero --select=F821 --show-source --statistics
        # Style report only
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
